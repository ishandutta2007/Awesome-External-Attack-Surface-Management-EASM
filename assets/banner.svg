<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1933" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#0072ff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1" fill="#00f2fe" fill-opacity="0.3"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 0.5px;
    }
    .radar-circle {
      stroke: #0284c7;
      fill: none;
      opacity: 0.25;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.2; transform: scale(0.98); }
      50% { opacity: 0.5; transform: scale(1.02); }
    }
    @keyframes sweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes ping {
      0% { r: 4px; opacity: 1; }
      100% { r: 24px; opacity: 0; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .animated-sweep {
      transform-origin: 1040px 180px;
      animation: sweep 8s linear infinite;
    }
    .ping-target-1 {
      animation: ping 2.5s cubic-bezier(0, 0.2, 0.8, 1) infinite;
      transform-origin: 1010px 130px;
    }
    .ping-target-2 {
      animation: ping 3s cubic-bezier(0, 0.2, 0.8, 1) infinite 1.2s;
      transform-origin: 1090px 220px;
    }
    .floating-badge {
      animation: floatParticle 4s ease-in-out infinite;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#cyberGrid)" />

  <!-- Accent Glow in Background -->
  <circle cx="200" cy="180" r="180" fill="#0284c7" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1040" cy="180" r="150" fill="#00f2fe" opacity="0.1" filter="url(#glow)"/>

  <!-- Radar Scanner Graphic (Right Side) -->
  <g id="radarGroup">
    <circle cx="1040" cy="180" r="140" class="radar-circle" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="1040" cy="180" r="100" class="radar-circle" stroke-width="1.5"/>
    <circle cx="1040" cy="180" r="60" class="radar-circle" stroke-width="1.5" stroke-dasharray="2 4"/>
    <circle cx="1040" cy="180" r="20" class="radar-circle" stroke-width="1.5"/>
    <line x1="900" y1="180" x2="1180" y2="180" stroke="#0284c7" stroke-width="1" opacity="0.2"/>
    <line x1="1040" y1="40" x2="1040" y2="320" stroke="#0284c7" stroke-width="1" opacity="0.2"/>

    <!-- Rotating Radar Cone -->
    <path class="animated-sweep" d="M 1040 180 L 1180 180 A 140 140 0 0 1 1139 279 Z" fill="url(#radarSweep)"/>

    <!-- Discovered Target Blips with Expanding Waves -->
    <circle cx="1010" cy="130" r="4" fill="#38bdf8"/>
    <circle class="ping-target-1" cx="1010" cy="130" r="4" fill="none" stroke="#38bdf8" stroke-width="1.5"/>

    <circle cx="1090" cy="220" r="4" fill="#f43f5e"/>
    <circle class="ping-target-2" cx="1090" cy="220" r="4" fill="none" stroke="#f43f5e" stroke-width="1.5"/>

    <circle cx="1070" cy="110" r="3" fill="#34d399" opacity="0.8"/>
    <circle cx="970" cy="220" r="3" fill="#fbbf24" opacity="0.8"/>
  </g>

  <!-- Foreground Left: Content & Branding -->
  <g transform="translate(60, 0)">
    <!-- Top Pill Badge -->
    <g class="floating-badge" transform="translate(0, 52)">
      <rect width="360" height="32" rx="16" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="16" cy="16" r="5" fill="#00f2fe">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="21" class="badge-text">🛡️ CONTINUOUS THREAT EXPOSURE &amp; DISCOVERY</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 138)">
      <text class="title-text">
        Awesome <tspan fill="url(#cyberCyan)">External Attack Surface</tspan>
      </text>
      <text y="48" class="title-text">
        Management (EASM) 🎯
      </text>
    </g>

    <!-- Subtitle -->
    <text x="0" y="235" class="subtitle-text">
      Curated commercial platforms, open-source scanners, and reconnaissance frameworks
    </text>

    <!-- Capability Tags / Pills -->
    <g transform="translate(0, 268)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="168" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">🌐 Asset Discovery</text>

      <!-- Tag 2 -->
      <rect x="180" y="0" width="168" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="194" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">🔍 Shadow IT &amp; DNS</text>

      <!-- Tag 3 -->
      <rect x="360" y="0" width="168" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="374" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">⚡ Exposure Prioritization</text>

      <!-- Tag 4 -->
      <rect x="540" y="0" width="155" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="554" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">🚀 CTEM Validation</text>
    </g>
  </g>
</svg>
